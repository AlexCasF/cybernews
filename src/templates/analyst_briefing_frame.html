<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Preview</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172026;
      background: #f5f7f8;
    }

    main {
      display: grid;
      gap: 14px;
      padding: 18px;
    }

    .preview-card {
      padding: 14px;
      background: white;
      border: 1px solid #dbe3e7;
      border-left: 5px solid #28d7d0;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: 1.4rem;
    }

    p {
      margin-top: 8px;
      color: #5a6872;
    }
  </style>
</head>
<body>
  <main>
    <section class="preview-card">
      <h1>Report Preview</h1>
      <p>Run Generate report from a headline card to preview a safe rendered report here.</p>
      <p>This frame is sandboxed and does not run generated scripts.</p>
    </section>
  </main>
</body>
</html>

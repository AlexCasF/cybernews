<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - CyberNews Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>User Dashboard</h1>
    <p>Logged in as {{ current_user.username }} ({{ current_user.role }}).</p>
    <nav>
      <a href="{{ url_for('news') }}">News</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
  </header>

  <main>
    <h2>Analyst Area</h2>
    <p>Welcome to your CyberNews Tracker dashboard.</p>
    <p>Login time: {{ current_user.login_time }}</p>
  </main>

  <footer>
    <p>&copy; 2026 CyberNews Tracker</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberNews Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome!</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">News</a></li>
        <li><a href="#">Reports</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <p>Latest cybersecurity updates will appear here soon.</p>
  </main>

  <footer>
    <p>&copy; 2025 CyberNews Tracker</p>
  </footer>

  <script>
    const hour = new Date().getHours();
    let message = "";

    if (hour < 12) {
      message = "Good Morning, Cyber Explorer!";
    } else if (hour < 18) {
      message = "Good Afternoon, Cyber Defender!";
    } else {
      message = "Good Evening, Night Watcher!";
    }

    console.log(message);
    document.querySelector("h1").textContent = message;
  </script>
</body>
</html>

{% extends "index.html" %}

{% block title %}CyberNews Tracker{% endblock %}

{% block header_text %}
  <p>Welcome, {{ username }}{% if current_user %} ({{ current_user.role }}){% endif %}.</p>
{% endblock %}

{% block content %}
  <p>Last updated: {{ last_updated }}</p>

  <button id="refreshButton">Refresh Headlines</button>
  <p id="newsMessage"></p>
  <ul id="headlinesContainer"></ul>

  <script>
    const headlinesContainer = document.getElementById("headlinesContainer");
    const newsMessage = document.getElementById("newsMessage");
    const refreshButton = document.getElementById("refreshButton");

    function showArticles(articles) {
      headlinesContainer.innerHTML = "";

      for (const article of articles) {
        const item = document.createElement("li");
        const link = document.createElement("a");
        const source = document.createElement("span");

        link.textContent = article.title;
        link.href = article.url;
        link.target = "_blank";

        source.textContent = " - " + article.source;

        item.appendChild(link);
        item.appendChild(source);
        headlinesContainer.appendChild(item);
      }
    }

    async function fetchNews(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Request failed");
      }

      return response.json();
    }

    async function loadLocalNews() {
      try {
        const data = await fetchNews("/api/news");
        showArticles(data.articles);
        newsMessage.textContent = "Showing local headlines.";
      } catch (error) {
        newsMessage.textContent = "News unavailable right now. Please try again later.";
      }
    }

    async function loadLiveNews() {
      try {
        const data = await fetchNews("/api/live-news");
        showArticles(data.articles);
        newsMessage.textContent = "Showing live headlines.";
      } catch (error) {
        newsMessage.textContent = "Live news unavailable. Showing local headlines instead.";
        loadLocalNews();
      }
    }

    refreshButton.addEventListener("click", loadLiveNews);
    loadLocalNews();
  </script>
{% endblock %}

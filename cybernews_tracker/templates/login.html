<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CyberNews Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>CyberNews Tracker</h1>
    <p>Login to create a server-side session.</p>
    <nav>
      <a href="{{ url_for('news') }}">News</a>
      <a href="{{ url_for('contact') }}">Contact</a>
      <a href="{{ url_for('cookie_check') }}">Cookie Check</a>
    </nav>
  </header>

  <main>
    <h2>Login</h2>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
      <label for="username">Username:</label>
      <input type="text" name="username" id="username" required>

      <label for="password">Password:</label>
      <input type="password" name="password" id="password" required>

      <button type="submit">Login</button>
    </form>

    <p>Test users: alice / alicepass, bob / bobpass</p>
  </main>

  <footer>
    <p>&copy; 2026 CyberNews Tracker</p>
  </footer>
</body>
</html>
